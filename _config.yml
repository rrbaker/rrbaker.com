# --- Site identity -----------------------------------------------------------
title: Rob Baker
tagline: Aspiring writer and literary editor
description: >-
  Rob Baker is an aspiring writer and literary editor in Worcester County, Massachusetts.
author: Rob Baker

# Full production URL, no trailing slash. Change this if the domain changes.
url: "https://rrbaker.com"
baseurl: ""

# Footer links, rendered by _layouts/default.html.
links:
  - name: Email
    url: "mailto:rrbaker@gmail.com"
  - name: Instagram
    url: "https://www.instagram.com/rrbaker"

# --- Build -------------------------------------------------------------------
# No theme: every layout and stylesheet in this repo is ours.
theme: null
plugins: []

permalink: pretty
markdown: kramdown
kramdown:
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
